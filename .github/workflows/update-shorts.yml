name: 쇼츠 목록 자동 갱신

on:
  schedule:
    - cron: '0 18 */3 * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 받기
        uses: actions/checkout@v4

      - name: 쇼츠 목록 수집 및 필터링
        run: python3 tools/update_shorts.py

      - name: 변경사항 저장
        run: |
          git config user.name "shorts-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/shorts.json
          git commit -m "쇼츠 목록 자동 갱신" || echo "변경 없음"
          git push
