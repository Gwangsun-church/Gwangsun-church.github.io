<!DOCTYPE html>
<html lang="ko" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>은혜앨범 — 광선교회</title>
  <link rel="icon" href="/favicon.ico" sizes="48x48">
  <link rel="icon" href="/img/favicon-32.png" type="image/png" sizes="32x32">
  <link rel="apple-touch-icon" href="/img/apple-touch-icon.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="site-top"></div>
  <div class="page-head"><div class="container">
    <div class="crumbs">홈 · 성도의 교제 · 은혜앨범</div>
    <h1>은혜앨범</h1>
    <p>교회 행사와 공동체의 소중한 순간을 사진으로 함께 나눕니다.</p>
  </div></div>

  <section class="block"><div class="container">
    <div class="toolbar">
      <div class="muted" id="count"></div>
      <button class="btn btn-primary btn-sm" id="newBtn">＋ 사진 올리기</button>
    </div>
    <div class="gallery-grid" id="grid"><div class="empty" style="grid-column:1/-1;">불러오는 중…</div></div>
  </div></section>

  <div id="site-foot"></div>

  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
  <script src="js/config.js"></script>
  <script src="js/common.js"></script>
  <script src="js/board.js"></script>
  <script>
    let openWrite, openDetail;
    async function load() {
      const list = await loadPosts('gallery');
      document.getElementById('count').textContent = `총 ${list.length}개`;
      const grid = document.getElementById('grid');
      if (!list.length) { grid.innerHTML = `<div class="empty" style="grid-column:1/-1;">아직 올라온 사진이 없습니다. 첫 사진을 올려보세요!</div>`; return; }
      grid.innerHTML = list.map(p => `
        <div class="gallery-card" data-id="${p.id}" style="cursor:pointer;">
          <div class="thumb">${(p.images && p.images[0]) ? `<img src="${esc(p.images[0])}" loading="lazy">` : '<div style="display:grid;place-items:center;height:100%;color:var(--color-text-muted)">🖼️</div>'}</div>
          <div class="cap"><h3>${esc(p.title)}</h3>
            <div class="meta">${esc(p.authorName)} · ${fmtDate(p.createdAt)}${(p.images || []).length > 1 ? ` · 📷 ${p.images.length}` : ''}</div></div>
        </div>`).join('');
      grid.querySelectorAll('[data-id]').forEach(el => el.onclick = () => openDetail(el.dataset.id));
    }
    onUserReady(() => {
      openWrite = setupWrite('gallery', load);
      openDetail = setupDetail(load);
      document.getElementById('newBtn').onclick = openWrite;
      load();
    });
  </script>
</body>
</html>
